<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Notas - Exame de Faixa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #263238;
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            color: #8b0000;
        }

        h2 {
            margin-bottom: 25px;
            color: #59636e;
            font-size: 1.05rem;
        }

        .status {
            min-height: 1.5em;
            font-weight: 600;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 18px;
            color: #fff;
            background-color: #245b87;
            border: 0;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.9);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            color: #fff;
            background-color: #2c3e50;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .media-final {
            color: #176b38;
            font-weight: bold;
        }

        .pendente {
            color: #777;
        }

        @media print {
            body {
                padding: 0;
                background: #fff;
            }

            .container {
                box-shadow: none;
            }

            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Associação Atarashii Karatê-Do Shotokan</h1>
        <h2>Consolidação das avaliações do exame</h2>

        <p id="semestre" class="status">Conectando ao servidor...</p>

        <div class="actions">
            <button type="button" onclick="carregarNotas()">Atualizar notas</button>
            <button type="button" onclick="prepararEmail()">Enviar relatório por e-mail</button>
            <button type="button" onclick="window.print()">Imprimir / PDF</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead id="cabecalho"></thead>
                <tbody id="corpo"></tbody>
            </table>
        </div>

        <p id="mensagem" class="status" role="status"></p>
    </main>

    <script>
        const API_URL = (
            window.API_URL
            || localStorage.getItem('atarashii_api_url')
            || 'https://SEU-SERVIDOR.onrender.com'
        ).replace(/\/$/, '');

        let token = sessionStorage.getItem('atarashii_exame_token') || '';
        let alunosAprovados = [];
        let avaliacoes = [];
        let semestreAtual = '';

        async function chamarApi(caminho, opcoes = {}) {
            const resposta = await fetch(`${API_URL}${caminho}`, {
                ...opcoes,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...(opcoes.headers || {})
                }
            });

            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) {
                throw new Error(dados.erro || `Falha na comunicação com o servidor (${resposta.status}).`);
            }
            return dados;
        }

        async function autenticarProfessor() {
            if (API_URL.includes('SEU-SERVIDOR')) {
                const endereco = prompt('Informe a URL base da API publicada, sem a barra final:');
                if (!endereco) return false;

                localStorage.setItem('atarashii_api_url', endereco.trim());
                location.reload();
                return false;
            }

            const usuario = prompt('Usuário do professor:');
            if (!usuario) return false;

            const senha = prompt('Senha do professor:');
            if (!senha) return false;

            const sessao = await chamarApi('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ usuario, senha })
            });

            token = sessao.token;
            sessionStorage.setItem('atarashii_exame_token', token);
            return true;
        }

        async function carregarNotas() {
            try {
                const [respostaAlunos, respostaAvaliacoes] = await Promise.all([
                    chamarApi('/api/exame-avaliacao/alunos'),
                    chamarApi('/api/exame-avaliacao/relatorio')
                ]);

                // Esta rota retorna somente alunos ativos com Kihon, Kata e Kumite aprovados.
                alunosAprovados = respostaAlunos.alunos || [];
                avaliacoes = respostaAvaliacoes.avaliacoes || [];
                semestreAtual = respostaAvaliacoes.semestre || respostaAlunos.semestre || '';

                desenharTabela();
                document.getElementById('semestre').textContent = `Semestre: ${semestreAtual}`;
                document.getElementById('mensagem').textContent = alunosAprovados.length
                    ? 'Notas atualizadas. A lista mostra somente os alunos aprovados para avaliação.'
                    : 'Não há alunos aprovados para avaliação neste semestre.';
            } catch (erro) {
                if (!token) {
                    try {
                        if (await autenticarProfessor()) {
                            return carregarNotas();
                        }
                    } catch (erroLogin) {
                        erro = erroLogin;
                    }
                } else {
                    token = '';
                    sessionStorage.removeItem('atarashii_exame_token');
                }

                // Em caso de falha, não deixa uma lista antiga visível.
                alunosAprovados = [];
                avaliacoes = [];
                desenharTabela();
                document.getElementById('mensagem').textContent = erro.message;
            }
        }

        function desenharTabela() {
            const avaliadores = [...new Set(avaliacoes.map(item => item.avaliador))]
                .sort((a, b) => a.localeCompare(b, 'pt-BR'));

            const titulos = ['<th>Nome do aluno</th>']
                .concat(avaliadores.map(nome => `<th>${escaparHtml(nome)}</th>`))
                .concat(['<th>Média final</th>', '<th>Avaliações</th>']);
            document.getElementById('cabecalho').innerHTML = `<tr>${titulos.join('')}</tr>`;

            const linhas = alunosAprovados.map(aluno => {
                const notasAluno = avaliacoes.filter(item => item.usuario === aluno.usuario);
                const medias = notasAluno
                    .map(item => Number(item.dados?.notas?.media))
                    .filter(Number.isFinite);
                const mediaFinal = medias.length
                    ? (medias.reduce((soma, nota) => soma + nota, 0) / medias.length).toFixed(2)
                    : '—';

                const colunasAvaliadores = avaliadores.map(nome => {
                    const avaliacao = notasAluno.find(item => item.avaliador === nome);
                    const media = avaliacao?.dados?.notas?.media;
                    return `<td>${media === undefined || media === null ? '—' : Number(media).toFixed(2)}</td>`;
                });

                return `<tr>
                    <td>${escaparHtml(aluno.nome)}</td>
                    ${colunasAvaliadores.join('')}
                    <td class="media-final">${mediaFinal}</td>
                    <td class="${medias.length ? '' : 'pendente'}">${medias.length}</td>
                </tr>`;
            });

            document.getElementById('corpo').innerHTML = linhas.length
                ? linhas.join('')
                : '<tr><td colspan="100%">Nenhum aluno aprovado para avaliação.</td></tr>';
        }

        function escaparHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[caractere]));
        }

        async function prepararEmail() {
            try {
                if (!token && !await autenticarProfessor()) return;

                if (!avaliacoes.length) {
                    document.getElementById('mensagem').textContent = 'Ainda não há avaliações salvas neste semestre.';
                    return;
                }

                const confirmacao = confirm(
                    'Preparar um único rascunho de email com as avaliações dos alunos aprovados?'
                );
                if (!confirmacao) return;

                const blocosAlunos = alunosAprovados.map(aluno => {
                    const registros = avaliacoes.filter(item => item.usuario === aluno.usuario);
                    const medias = registros
                        .map(item => Number(item.dados?.notas?.media))
                        .filter(Number.isFinite);
                    const media = medias.length
                        ? (medias.reduce((soma, nota) => soma + nota, 0) / medias.length).toFixed(2)
                        : 'Sem notas';

                    const detalhes = registros.map(item => {
                        const dados = item.dados || {};
                        const notas = dados.notas || {};
                        const observacoes = dados.observacoes || {};

                        return [
                            `Avaliador: ${item.avaliador}`,
                            `Notas: Kihon ${notas.kihon ?? '-'}; Kata ${notas.kata ?? '-'}; Kumite ${notas.kumite ?? '-'}; Perguntas ${notas.perguntas ?? '-'}; Média ${notas.media ?? '-'}`,
                            `Resultado: ${dados.resultado || '-'} | Faixa pretendida: ${dados.faixaPretendida || '-'} | Conceito: ${dados.conceito || '-'}`,
                            `Pontos fortes: ${(dados.pontosFortes || []).join('; ') || '-'}`,
                            `Melhorias: ${(dados.melhorias || []).join('; ') || '-'}`,
                            `Observações — Kihon: ${observacoes.kihon || '-'} | Kata: ${observacoes.kata || '-'} | Kumite: ${observacoes.kumite || '-'}`
                        ].join('\r\n');
                    }).join('\r\n\r\n');

                    return `${aluno.nome} — média dos avaliadores: ${media} (${medias.length} avaliação(ões))\r\n${detalhes || 'Sem avaliação registrada.'}`;
                });

                const corpoEmail = [
                    `Relatório consolidado do Exame de Faixa — ${semestreAtual}`,
                    'Associação Atarashii Karatê-Do Shotokan',
                    '',
                    blocosAlunos.join('\r\n\r\n----------------------------------------\r\n\r\n')
                ].join('\r\n');

                const assunto = encodeURIComponent(`Notas do Exame de Faixa - ${semestreAtual}`);
                const corpo = encodeURIComponent(corpoEmail);
                location.href = `mailto:luedo25@msn.com?subject=${assunto}&body=${corpo}`;
                document.getElementById('mensagem').textContent =
                    'Rascunho aberto no aplicativo de email. Revise e envie para o professor.';
            } catch (erro) {
                document.getElementById('mensagem').textContent = erro.message;
            }
        }

        document.addEventListener('DOMContentLoaded', carregarNotas);
    </script>
</body>
</html>

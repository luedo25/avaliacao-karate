<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Notas - Exame de Faixa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #263238;
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            color: #8b0000;
        }

        h2 {
            margin-bottom: 25px;
            color: #59636e;
            font-size: 1.05rem;
        }

        .status {
            min-height: 1.5em;
            font-weight: 600;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 18px;
            color: #fff;
            background-color: #245b87;
            border: 0;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.9);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 940px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            color: #fff;
            background-color: #2c3e50;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .media-final {
            color: #176b38;
            font-weight: bold;
        }

        .pendente {
            color: #777;
        }

        .aluno-cabecalho td {
            color: #fff;
            background: #44596e;
            font-weight: 700;
        }

        .linha-media td {
            background: #edf6ef;
            font-weight: 700;
        }

        .nota {
            text-align: center;
            white-space: nowrap;
        }

        @media print {
            body {
                padding: 0;
                background: #fff;
            }

            .container {
                box-shadow: none;
            }

            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Associação Atarashii Karatê-Do Shotokan</h1>
        <h2>Consolidação das avaliações do exame</h2>

        <p id="semestre" class="status">Conectando ao servidor...</p>

        <div class="actions">
            <button type="button" onclick="carregarNotas()">Atualizar notas</button>
            <button type="button" onclick="prepararEmail()">Enviar relatório por e-mail</button>
            <button type="button" onclick="window.print()">Imprimir / PDF</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead id="cabecalho"></thead>
                <tbody id="corpo"></tbody>
            </table>
        </div>

        <p id="mensagem" class="status" role="status"></p>
    </main>

    <script>
        const API_URL = 'https://api-associacao-mp.onrender.com';

        let alunosAprovados = [];
        let avaliacoes = [];
        let semestreAtual = '';

        async function chamarApi(caminho, opcoes = {}) {
            const resposta = await fetch(`${API_URL}${caminho}`, {
                ...opcoes,
                headers: {
                    'Content-Type': 'application/json',
                    ...(opcoes.headers || {})
                }
            });

            const dados = await resposta.json().catch(() => ({}));
            if (!resposta.ok) {
                throw new Error(dados.erro || `Falha na comunicação com o servidor (${resposta.status}).`);
            }
            return dados;
        }

        async function carregarNotas() {
            try {
                const [respostaAlunos, respostaAvaliacoes] = await Promise.all([
                    chamarApi('/api/exame-avaliacao/alunos'),
                    chamarApi('/api/exame-avaliacao/relatorio')
                ]);

                alunosAprovados = respostaAlunos.alunos || [];
                avaliacoes = respostaAvaliacoes.avaliacoes || [];
                semestreAtual = respostaAvaliacoes.semestre || respostaAlunos.semestre || '';

                desenharTabela();
                document.getElementById('semestre').textContent = `Semestre: ${semestreAtual}`;
                document.getElementById('mensagem').textContent = alunosAprovados.length
                    ? 'Notas atualizadas. A lista mostra somente os alunos aprovados para avaliação.'
                    : 'Não há alunos aprovados para avaliação neste semestre.';
            } catch (erro) {
                alunosAprovados = [];
                avaliacoes = [];
                desenharTabela();
                document.getElementById('mensagem').textContent = erro.message;
            }
        }

        function desenharTabela() {
            document.getElementById('cabecalho').innerHTML = `<tr>
                <th>Aluno</th><th>Avaliador</th><th>Kihon</th><th>Kata</th><th>Kumite</th>
                <th>Perguntas</th><th>Kata acima da faixa</th><th>Média do avaliador</th>
            </tr>`;

            const linhas = alunosAprovados.map(aluno => {
                const registros = avaliacoes
                    .filter(item => item.usuario === aluno.usuario)
                    .sort((a, b) => String(a.avaliador || '').localeCompare(String(b.avaliador || ''), 'pt-BR'));
                
                let somaKihon = 0, qtdKihon = 0;
                let somaKata = 0, qtdKata = 0;
                let somaKumite = 0, qtdKumite = 0;

                registros.forEach(item => {
                    const notas = item.dados?.notas || {};
                    if (notas.kihon !== undefined && notas.kihon !== null && notas.kihon !== '') {
                        somaKihon += Number(notas.kihon);
                        qtdKihon++;
                    }
                    if (notas.kata !== undefined && notas.kata !== null && notas.kata !== '') {
                        somaKata += Number(notas.kata);
                        qtdKata++;
                    }
                    if (notas.kumite !== undefined && notas.kumite !== null && notas.kumite !== '') {
                        somaKumite += Number(notas.kumite);
                        qtdKumite++;
                    }
                });

                const medias = registros
                    .map(obterMediaAvaliador)
                    .filter(media => media !== null);
                const mediaConsolidada = medias.length
                    ? (medias.reduce((soma, nota) => soma + nota, 0) / medias.length).toFixed(2)
                    : '—';
                
                const exibirMedias = medias.length > 1;
                const mediaKihonStr = (exibirMedias && qtdKihon > 0) ? (somaKihon / qtdKihon).toFixed(2) : '';
                const mediaKataStr = (exibirMedias && qtdKata > 0) ? (somaKata / qtdKata).toFixed(2) : '';
                const mediaKumiteStr = (exibirMedias && qtdKumite > 0) ? (somaKumite / qtdKumite).toFixed(2) : '';

                const linhasAvaliacoes = registros.length
                    ? registros.map(item => {
                        const notas = item.dados?.notas || {};
                        return `<tr>
                            <td>${escaparHtml(aluno.nome)}</td>
                            <td>${escaparHtml(item.avaliador)}</td>
                            <td class="nota">${formatarNota(notas.kihon)}</td>
                            <td class="nota">${formatarNota(notas.kata)}</td>
                            <td class="nota">${formatarNota(notas.kumite)}</td>
                            <td class="nota">${formatarNota(notas.perguntas)}</td>
                            <td class="nota">${formatarNota(notas.kataAcima)}</td>
                            <td class="nota media-final">${formatarNota(notas.media)}</td>
                        </tr>`;
                    }).join('')
                    : `<tr><td>${escaparHtml(aluno.nome)}</td><td colspan="7" class="pendente">Sem avaliações registradas</td></tr>`;
                
                const linhaConsolidada = `<tr class="linha-media">
                    <td colspan="2">Média consolidada de ${medias.length} avaliador(es)</td>
                    <td class="nota media-final">${mediaKihonStr}</td>
                    <td class="nota media-final">${mediaKataStr}</td>
                    <td class="nota media-final">${mediaKumiteStr}</td>
                    <td colspan="2"></td>
                    <td class="nota media-final">${mediaConsolidada}</td>
                </tr>`;
                
                return `<tr class="aluno-cabecalho"><td colspan="8">${escaparHtml(aluno.nome)}</td></tr>${linhasAvaliacoes}${linhaConsolidada}`;
            });

            document.getElementById('corpo').innerHTML = linhas.length
                ? linhas.join('')
                : '<tr><td colspan="100%">Nenhum aluno aprovado para avaliação.</td></tr>';
        }

        function escaparHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[caractere]));
        }

        function formatarNota(valor) {
            if (valor === undefined || valor === null || valor === '') return '—';
            const numero = Number(valor);
            return Number.isFinite(numero) ? numero.toFixed(2) : '—';
        }

        function obterMediaAvaliador(avaliacao) {
            const media = avaliacao?.dados?.notas?.media;
            return typeof media === 'number' && Number.isFinite(media) ? media : null;
        }

        async function prepararEmail() {
            try {
                if (!avaliacoes.length) {
                    document.getElementById('mensagem').textContent = 'Ainda não há avaliações salvas neste semestre.';
                    return;
                }

                const confirmacao = confirm(
                    'Preparar um único rascunho de email com as avaliações dos alunos aprovados?'
                );
                if (!confirmacao) return;

                const blocosAlunos = alunosAprovados.map(aluno => {
                    const registros = avaliacoes.filter(item => item.usuario === aluno.usuario);
                    
                    let somaKihon = 0, qtdKihon = 0;
                    let somaKata = 0, qtdKata = 0;
                    let somaKumite = 0, qtdKumite = 0;

                    registros.forEach(item => {
                        const notas = item.dados?.notas || {};
                        if (notas.kihon !== undefined && notas.kihon !== null && notas.kihon !== '') {
                            somaKihon += Number(notas.kihon);
                            qtdKihon++;
                        }
                        if (notas.kata !== undefined && notas.kata !== null && notas.kata !== '') {
                            somaKata += Number(notas.kata);
                            qtdKata++;
                        }
                        if (notas.kumite !== undefined && notas.kumite !== null && notas.kumite !== '') {
                            somaKumite += Number(notas.kumite);
                            qtdKumite++;
                        }
                    });

                    const medias = registros
                        .map(obterMediaAvaliador)
                        .filter(media => media !== null);
                    
                    const mediaGeral = medias.length
                        ? (medias.reduce((soma, nota) => soma + nota, 0) / medias.length).toFixed(2)
                        : 'Sem notas';

                    // Estrutura do cabecalho usando apenas caracteres seguros (sem emojis)
                    const nomeSeguro = String(aluno.nome || 'Sem nome').toUpperCase();
                    let cabecalhoAluno = `[ ALUNO(A): ${nomeSeguro} ]\r\nMedia Final: ${mediaGeral} (Baseado em${medias.length} avaliacao(oes))`;
                    
                    if (medias.length > 1) {
                        const mediaK = qtdKihon > 0 ? (somaKihon / qtdKihon).toFixed(2) : '-';
                        const mediaKa = qtdKata > 0 ? (somaKata / qtdKata).toFixed(2) : '-';
                        const mediaKu = qtdKumite > 0 ? (somaKumite / qtdKumite).toFixed(2) : '-';
                        cabecalhoAluno += `\r\nMedias Consolidadas: Kihon: ${mediaK} | Kata: ${mediaKa} \vert{} Kumite:${mediaKu}`;
                    }

                    const detalhes = registros.map(item => {
                        const dados = item.dados || {};
                        const notas = dados.notas || {};
                        const observacoes = dados.observacoes || {};

                        return [
                            `AVALIADOR(A): ${item.avaliador || '-'}`,
                            `Resultado: ${dados.resultado || '-'} | Faixa pretendida: ${dados.faixaPretendida \vert{}\vert{} '-'} \vert{} Conceito:${dados.conceito || '-'}`,
                            ``,
                            `NOTAS:`,
                            `- Kihon: ${notas.kihon ?? '-'} | Kata: ${notas.kata ?? '-'} \vert{} Kumite: ${notas.kumite ?? '-'}`,
                            `- Perguntas: ${notas.perguntas ?? '-'} | Kata acima: ${notas.kataAcima ?? '-'}`,
                            `- Media do Avaliador: ${notas.media ?? '-'}`,
                            ``,
                            `FEEDBACK:`,
                            `- Pontos fortes: ${(dados.pontosFortes || []).join(', ') || '-'}`,
                            `- Pontos a melhorar: ${(dados.melhorias || []).join(', ') || '-'}`,
                            ``,
                            `OBSERVACOES ESPECIFICAS:`,
                            `- Kihon: ${observacoes.kihon || '-'}`,
                            `- Kata: ${observacoes.kata || '-'}`,
                            `- Kumite: ${observacoes.kumite || '-'}`
                        ].join('\r\n');
                    }).join('\r\n\r\n');

                    return `${cabecalhoAluno}\r\n\r\n${detalhes || 'Sem avaliação registrada.'}`;
                });

                // Estrutura principal do e-mail com caracteres seguros
                const corpoEmail = [
                    '======================================================',
                    `   RELATORIO CONSOLIDADO DO EXAME DE FAIXA - ${semestreAtual}`,
                    '   Associacao Atarashii Karate-Do Shotokan',
                    '======================================================',
                    '',
                    '',
                    blocosAlunos.join('\r\n\r\n------------------------------------------------------\r\n\r\n')
                ].join('\r\n');

                const assunto = encodeURIComponent(`Notas do Exame de Faixa - ${semestreAtual}`);
                const corpo = encodeURIComponent(corpoEmail);
                location.href = `mailto:luedo25@msn.com?subject=${assunto}&body=${corpo}`;
                document.getElementById('mensagem').textContent =
                    'Rascunho aberto no aplicativo de email. Revise e envie para o professor.';
            } catch (erro) {
                document.getElementById('mensagem').textContent = erro.message;
            }
        }

        document.addEventListener('DOMContentLoaded', carregarNotas);
    </script>
</body>
</html>
